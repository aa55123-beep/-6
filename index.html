<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學科測驗 — 答題卷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1EDE1;
    --paper-2:#E7E1D0;
    --ink:#2A2A22;
    --ink-soft:#5B5A4E;
    --olive:#55603F;
    --olive-deep:#3C4530;
    --line:#C9C1A6;
    --stamp:#A13D2B;
    --stamp-2:#8A3323;
    --correct:#3F6B4A;
    --wrong:#A13D2B;
    --gold:#9C7A32;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 800px at 10% -10%, #F6F2E7 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    line-height:1.6;
    padding-bottom:80px;
  }
  ::selection{ background:var(--gold); color:#fff; }

  /* header */
  header{
    position:relative;
    padding:52px 24px 40px;
    border-bottom:3px double var(--olive-deep);
    background:
      repeating-linear-gradient(135deg, rgba(85,96,63,0.045) 0 2px, transparent 2px 14px),
      var(--paper);
    overflow:hidden;
  }
  .eyebrow{
    font-family:'Roboto Mono', monospace;
    font-size:12px;
    letter-spacing:.22em;
    color:var(--olive);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:center;
    margin-bottom:14px;
  }
  .eyebrow::before, .eyebrow::after{
    content:'';
    height:1px;
    width:36px;
    background:var(--olive);
    opacity:.5;
  }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    text-align:center;
    font-size:clamp(26px, 4.4vw, 42px);
    margin:0 0 10px;
    color:var(--olive-deep);
    letter-spacing:.03em;
  }
  .subtitle{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    font-family:'Roboto Mono', monospace;
    letter-spacing:.04em;
  }
  .meta-row{
    max-width:760px;
    margin:26px auto 0;
    display:flex;
    justify-content:space-between;
    font-family:'Roboto Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
    padding-top:14px;
    flex-wrap:wrap;
    gap:8px;
  }

  /* progress bar - "answer sheet fill" */
  .progress-wrap{
    max-width:760px;
    margin:18px auto 0;
    position:sticky;
    top:0;
    z-index:50;
  }
  .progress-shell{
    background:var(--paper-2);
    border:1px solid var(--line);
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:14px;
    box-shadow:0 6px 16px -10px rgba(0,0,0,.3);
    backdrop-filter:blur(2px);
  }
  .progress-track{
    flex:1;
    height:8px;
    background:repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 8px), #ded6bc;
    position:relative;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--olive), var(--olive-deep));
    transition:width .25s ease;
  }
  .progress-count{
    font-family:'Roboto Mono', monospace;
    font-size:13px;
    white-space:nowrap;
    font-weight:700;
    color:var(--olive-deep);
    min-width:74px;
    text-align:right;
  }

  /* batch nav */
  .batch-shell{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-top:none;
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .batch-label{
    font-family:'Roboto Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.08em;
    flex-shrink:0;
  }
  .batch-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    flex:1;
  }
  .batch-tab{
    font-family:'Roboto Mono', monospace;
    font-size:12px;
    font-weight:700;
    padding:5px 9px;
    border:1px solid var(--line);
    background:#fbf9f2;
    color:var(--ink-soft);
    cursor:pointer;
    position:relative;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .batch-tab:hover{ border-color:var(--olive); color:var(--olive-deep); }
  .batch-tab.active{
    background:var(--olive-deep);
    border-color:var(--olive-deep);
    color:#fff;
  }
  .batch-tab .dot{
    display:inline-block;
    width:6px; height:6px;
    border-radius:50%;
    margin-left:6px;
    background:var(--line);
    vertical-align:middle;
  }
  .batch-tab.done .dot{ background:var(--olive); }
  .batch-tab.active .dot{ background:#fff; }
  .batch-nav-btns{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .batch-nav-btns button{
    padding:6px 12px;
    font-size:13px;
  }

  /* review shell */
  .review-shell{
    background:linear-gradient(90deg, #f6ece8, #f1e6d9);
    border:1px solid var(--stamp);
    border-top:none;
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .review-icon{
    font-size:16px;
    color:var(--stamp);
    flex-shrink:0;
  }
  .review-text{
    font-family:'Roboto Mono', monospace;
    font-size:12.5px;
    color:var(--stamp-2);
    flex:1;
    font-weight:700;
  }
  .review-btn{
    background:var(--stamp);
    border:2px solid var(--stamp);
    padding:8px 16px;
    font-size:13px;
  }
  .review-btn:hover{ background:var(--stamp-2); border-color:var(--stamp-2); }
  .review-btn:disabled{
    background:#c9bfae;
    border-color:#c9bfae;
    color:#8a8272;
    cursor:not-allowed;
  }
  .review-banner{
    max-width:100%;
    margin:0 0 18px;
    padding:12px 16px;
    background:linear-gradient(90deg, #f6ece8, #f1e6d9);
    border:1px solid var(--stamp);
    color:var(--stamp-2);
    font-family:'Roboto Mono', monospace;
    font-size:13px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
  }

  main{
    max-width:760px;
    margin:0 auto;
    padding:30px 20px 0;
  }

  /* question card */
  .q-card{
    background:var(--paper);
    border:1px solid var(--line);
    padding:22px 20px 20px;
    margin-bottom:18px;
    position:relative;
  }
  .q-card::before{
    content:'';
    position:absolute;
    left:0; top:0; bottom:0;
    width:4px;
    background:var(--line);
    transition:background .2s ease;
  }
  .q-card.answered::before{ background:var(--olive); }
  .q-card.correct::before{ background:var(--correct); }
  .q-card.wrong::before{ background:var(--wrong); }

  .q-head{
    display:flex;
    gap:12px;
    align-items:baseline;
    margin-bottom:12px;
  }
  .q-num{
    font-family:'Roboto Mono', monospace;
    font-weight:700;
    font-size:14px;
    color:#fff;
    background:var(--olive-deep);
    padding:3px 9px;
    min-width:38px;
    text-align:center;
    flex-shrink:0;
  }
  .q-text{
    font-size:16px;
    font-weight:500;
    color:var(--ink);
  }
  .q-ref{
    font-family:'Roboto Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-left:50px;
    margin-top:-6px;
    margin-bottom:10px;
    opacity:.75;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-left:50px;
  }
  .opt{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:9px 12px;
    border:1px solid var(--line);
    background:#fbf9f2;
    cursor:pointer;
    font-size:14.5px;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .opt:hover{ border-color:var(--olive); background:#f4efdf; }
  .opt:active{ transform:scale(.997); }
  .opt-letter{
    font-family:'Roboto Mono', monospace;
    font-weight:700;
    color:var(--olive-deep);
    border:1px solid var(--olive-deep);
    width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    font-size:12px;
    background:#fff;
  }
  .opt.selected{
    border-color:var(--olive-deep);
    background:#e9e4cf;
  }
  .opt.selected .opt-letter{
    background:var(--olive-deep);
    color:#fff;
  }
  .q-card.graded .opt{ cursor:default; }
  .q-card.graded .opt.reveal-correct{
    border-color:var(--correct);
    background:#e7f0e8;
  }
  .q-card.graded .opt.reveal-correct .opt-letter{
    background:var(--correct); color:#fff; border-color:var(--correct);
  }
  .q-card.graded .opt.reveal-wrong{
    border-color:var(--wrong);
    background:#f5e7e4;
  }
  .q-card.graded .opt.reveal-wrong .opt-letter{
    background:var(--wrong); color:#fff; border-color:var(--wrong);
  }

  .q-status{
    margin-left:50px;
    margin-top:8px;
    font-family:'Roboto Mono', monospace;
    font-size:12px;
    display:none;
    gap:6px;
    align-items:center;
  }
  .q-card.graded .q-status{ display:flex; }
  .q-status.ok{ color:var(--correct); }
  .q-status.bad{ color:var(--wrong); }

  /* control bar */
  .control-bar{
    max-width:760px;
    margin:26px auto 0;
    padding:0 20px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }
  button{
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:13px 26px;
    border:2px solid var(--olive-deep);
    background:var(--olive-deep);
    color:#fff;
    cursor:pointer;
    letter-spacing:.04em;
    transition:background .15s ease, transform .1s ease;
  }
  button:hover{ background:var(--olive); }
  button:active{ transform:scale(.98); }
  button.secondary{
    background:transparent;
    color:var(--olive-deep);
  }
  button.secondary:hover{ background:rgba(85,96,63,.08); }
  button:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }

  /* result stamp */
  .result-panel{
    max-width:760px;
    margin:30px auto 0;
    padding:20px;
    display:none;
  }
  .result-panel.show{ display:block; }
  .stamp-box{
    border:3px double var(--olive-deep);
    background:var(--paper-2);
    padding:34px 24px;
    text-align:center;
    position:relative;
  }
  .stamp{
    display:inline-block;
    border:5px solid var(--stamp);
    color:var(--stamp);
    border-radius:50%;
    width:150px; height:150px;
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transform:rotate(-8deg);
    margin:0 auto 18px;
    opacity:.92;
  }
  .stamp .score-num{ font-size:38px; line-height:1; }
  .stamp .score-label{ font-family:'Roboto Mono', monospace; font-size:11px; letter-spacing:.15em; margin-top:4px;}
  .result-detail{
    font-family:'Roboto Mono', monospace;
    font-size:13px;
    color:var(--ink-soft);
  }
  .result-detail b{ color:var(--olive-deep); }

  footer{
    text-align:center;
    font-family:'Roboto Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    padding:40px 20px 10px;
    opacity:.7;
  }

  @media (max-width:480px){
    .q-ref, .options, .q-status{ margin-left:0; margin-top:8px; }
    .q-head{ flex-wrap:wrap; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">儲備教官甄選</div>
  <h1>學科測驗</h1>
  <div class="subtitle">題庫（共 100 題）</div>
  <div class="meta-row">
    <span>題庫版本：選項亂數重排</span>
    <span id="metaTimer">作答時間：00:00</span>
  </div>
</header>

<div class="progress-wrap">
  <div class="progress-shell">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-count" id="progressCount">0 / 100</div>
  </div>
  <div class="batch-shell" id="batchShell">
    <span class="batch-label">分批：</span>
    <div class="batch-tabs" id="batchTabs"></div>
    <div class="batch-nav-btns">
      <button class="secondary" id="prevBatch">← 上一批</button>
      <button class="secondary" id="nextBatch">下一批 →</button>
    </div>
  </div>
  <div class="review-shell" id="reviewShell">
    <span class="review-icon">✎</span>
    <span class="review-text" id="reviewText">目前沒有錯題需要複習</span>
    <button class="review-btn" id="startReviewBtn" disabled>開始複習錯題</button>
  </div>
</div>

<main id="quizContainer"></main>

<div class="control-bar" id="normalControls">
  <button id="submitBtn">批改本批（<span id="submitBatchLabel">1-10</span>）</button>
  <button class="secondary" id="submitAllBtn">批改全部 100 題</button>
  <button class="secondary" id="resetBtn">重新作答</button>
</div>

<div class="control-bar" id="reviewControls" style="display:none;">
  <button id="submitReviewBtn">批改複習</button>
  <button class="secondary" id="reshuffleReviewBtn">重新洗牌複習題</button>
  <button class="secondary" id="backToAllBtn">返回完整測驗</button>
</div>

<div class="result-panel" id="resultPanel">
  <div class="stamp-box">
    <div class="stamp">
      <div class="score-num" id="scoreNum">0</div>
      <div class="score-label">分 / 100</div>
    </div>
    <div class="result-detail">
      答對 <b id="correctCount">0</b> 題　答錯 <b id="wrongCount">0</b> 題　未作答 <b id="blankCount">0</b> 題
    </div>
  </div>
</div>

<footer>本測驗選項已隨機重新排列，正確答案不固定為 A。</footer>

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

const LETTERS = ['A','B','C','D'];

const questions = RAW.map((row, idx) => {
  const [text, ref, opts] = row;
  const originalCorrect = opts[0]; // source answer is always the first listed option
  const order = shuffle([0,1,2,3]);
  const shuffledOpts = order.map(i => opts[i]);
  const correctIndex = shuffledOpts.indexOf(originalCorrect);
  return {
    num: idx+1,
    text, ref,
    originalCorrect,
    options: shuffledOpts,
    correctIndex,
    selected: null
  };
});

const wrongSet = new Set(); // question nums that need review (last graded as wrong or blank)
let reviewMode = false;

const BATCH_SIZE = 10;
const totalBatches = Math.ceil(questions.length / BATCH_SIZE);
let currentBatch = 0; // zero-indexed

const container = document.getElementById('quizContainer');
const progressFill = document.getElementById('progressFill');
const progressCount = document.getElementById('progressCount');
const batchTabs = document.getElementById('batchTabs');
const submitBatchLabel = document.getElementById('submitBatchLabel');
const batchShell = document.getElementById('batchShell');
const reviewText = document.getElementById('reviewText');
const startReviewBtn = document.getElementById('startReviewBtn');
const normalControls = document.getElementById('normalControls');
const reviewControls = document.getElementById('reviewControls');

function updateReviewUI(){
  const n = wrongSet.size;
  if(n === 0){
    reviewText.textContent = '目前沒有錯題需要複習';
    startReviewBtn.disabled = true;
    startReviewBtn.textContent = '開始複習錯題';
  } else {
    reviewText.textContent = `已彙整 ${n} 題答錯／未答的題目`;
    startReviewBtn.disabled = false;
    startReviewBtn.textContent = `開始複習錯題 (${n})`;
  }
}

function reshuffleQuestion(q){
  const order = shuffle([0,1,2,3]);
  const newOpts = order.map(i => q.options[i]);
  q.options = newOpts;
  q.correctIndex = newOpts.indexOf(q.originalCorrect);
  q.selected = null;
}

function enterReviewMode(){
  if(wrongSet.size === 0) return;
  reviewMode = true;
  batchShell.style.display = 'none';
  normalControls.style.display = 'none';
  reviewControls.style.display = 'flex';
  const list = questions.filter(q => wrongSet.has(q.num));
  list.forEach(reshuffleQuestion);
  renderQuestions(list, true);
  document.getElementById('resultPanel').classList.remove('show');
  window.scrollTo({top: document.querySelector('.progress-wrap').offsetTop - 8, behavior:'smooth'});
}

function exitReviewMode(){
  reviewMode = false;
  batchShell.style.display = 'flex';
  normalControls.style.display = 'flex';
  reviewControls.style.display = 'none';
  document.getElementById('resultPanel').classList.remove('show');
  renderBatch();
}

startReviewBtn.addEventListener('click', enterReviewMode);
document.getElementById('backToAllBtn').addEventListener('click', exitReviewMode);
document.getElementById('reshuffleReviewBtn').addEventListener('click', () => {
  const list = questions.filter(q => wrongSet.has(q.num));
  if(list.length === 0) return;
  list.forEach(reshuffleQuestion);
  renderQuestions(list, true);
  document.getElementById('resultPanel').classList.remove('show');
});

function batchRange(batchIdx){
  const start = batchIdx * BATCH_SIZE;
  const end = Math.min(start + BATCH_SIZE, questions.length);
  return [start, end];
}

function renderTabs(){
  batchTabs.innerHTML = '';
  for(let b=0; b<totalBatches; b++){
    const [start,end] = batchRange(b);
    const tab = document.createElement('div');
    tab.className = 'batch-tab';
    tab.textContent = `${start+1}-${end}`;
    const dot = document.createElement('span');
    dot.className = 'dot';
    tab.appendChild(dot);
    const rangeQs = questions.slice(start,end);
    const allAnswered = rangeQs.every(q => q.selected !== null);
    if(allAnswered) tab.classList.add('done');
    if(b === currentBatch) tab.classList.add('active');
    tab.addEventListener('click', () => { currentBatch = b; renderBatch(); });
    batchTabs.appendChild(tab);
  }
}

function renderBatch(){
  const [start,end] = batchRange(currentBatch);
  submitBatchLabel.textContent = `${start+1}-${end}`;
  renderTabs();
  renderQuestions(questions.slice(start,end));
  updateProgress();
  window.scrollTo({top: document.querySelector('.progress-wrap').offsetTop - 8, behavior:'smooth'});
}

document.getElementById('prevBatch').addEventListener('click', () => {
  currentBatch = Math.max(0, currentBatch - 1);
  renderBatch();
});
document.getElementById('nextBatch').addEventListener('click', () => {
  currentBatch = Math.min(totalBatches - 1, currentBatch + 1);
  renderBatch();
});

function renderQuestions(list, isReview){
  container.innerHTML = '';
  if(isReview){
    const banner = document.createElement('div');
    banner.className = 'review-banner';
    banner.innerHTML = `<span>✎</span><span>錯題複習模式：以下共 ${list.length} 題，選項已重新洗牌，答對後將從錯題本移除</span>`;
    container.appendChild(banner);
  }
  list.forEach(q => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card-' + q.num;

    const head = document.createElement('div');
    head.className = 'q-head';
    head.innerHTML = `<span class="q-num">${String(q.num).padStart(3,'0')}</span><span class="q-text">${q.text}</span>`;
    card.appendChild(head);

    const ref = document.createElement('div');
    ref.className = 'q-ref';
    ref.textContent = q.ref;
    card.appendChild(ref);

    const optsWrap = document.createElement('div');
    optsWrap.className = 'options';
    q.options.forEach((optText, i) => {
      const opt = document.createElement('div');
      opt.className = 'opt';
      opt.dataset.index = i;
      opt.innerHTML = `<span class="opt-letter">${LETTERS[i]}</span><span>${optText}</span>`;
      opt.addEventListener('click', () => selectOption(q, i));
      optsWrap.appendChild(opt);
    });
    card.appendChild(optsWrap);

    const status = document.createElement('div');
    status.className = 'q-status';
    status.id = 'status-' + q.num;
    card.appendChild(status);

    container.appendChild(card);
  });
  updateProgress();
}

function selectOption(q, i){
  q.selected = i;
  const card = document.getElementById('card-' + q.num);
  card.classList.add('answered');
  [...card.querySelectorAll('.opt')].forEach(el => {
    el.classList.toggle('selected', Number(el.dataset.index) === i);
  });
  updateProgress();
  if(!reviewMode) renderTabs();
}

function updateProgress(){
  const answered = questions.filter(q => q.selected !== null).length;
  const pct = Math.round((answered/questions.length)*100);
  progressFill.style.width = pct + '%';
  progressCount.textContent = answered + ' / ' + questions.length;
}

let startTime = Date.now();
let timerInterval = setInterval(() => {
  const s = Math.floor((Date.now()-startTime)/1000);
  const m = String(Math.floor(s/60)).padStart(2,'0');
  const sec = String(s%60).padStart(2,'0');
  document.getElementById('metaTimer').textContent = `作答時間：${m}:${sec}`;
}, 1000);

function gradeCard(q){
  const card = document.getElementById('card-' + q.num);
  if(!card) return null; // not currently rendered
  card.classList.add('graded');
  const opts = [...card.querySelectorAll('.opt')];
  if(q.selected === null){
    document.getElementById('status-'+q.num).innerHTML = '未作答';
    document.getElementById('status-'+q.num).className = 'q-status bad';
    opts[q.correctIndex].classList.add('reveal-correct');
    return 'blank';
  } else if(q.selected === q.correctIndex){
    card.classList.add('correct');
    document.getElementById('status-'+q.num).innerHTML = '✓ 正確';
    document.getElementById('status-'+q.num).className = 'q-status ok';
    opts[q.correctIndex].classList.add('reveal-correct');
    return 'correct';
  } else {
    card.classList.add('wrong');
    document.getElementById('status-'+q.num).innerHTML = `✗ 錯誤，正確答案為 ${LETTERS[q.correctIndex]}`;
    document.getElementById('status-'+q.num).className = 'q-status bad';
    opts[q.selected].classList.add('reveal-wrong');
    opts[q.correctIndex].classList.add('reveal-correct');
    return 'wrong';
  }
}

function showResult(list, correct, wrong, blank){
  document.getElementById('scoreNum').textContent = correct;
  document.querySelector('.score-label').textContent = `分 / ${list.length}`;
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('blankCount').textContent = blank;
  document.getElementById('resultPanel').classList.add('show');
  document.getElementById('resultPanel').scrollIntoView({behavior:'smooth', block:'start'});
}

function recordWrongState(q, r){
  if(r === 'correct') wrongSet.delete(q.num);
  else wrongSet.add(q.num); // 'wrong' or 'blank' both need review
}

document.getElementById('submitBtn').addEventListener('click', () => {
  const [start,end] = batchRange(currentBatch);
  const list = questions.slice(start,end);
  let correct = 0, wrong = 0, blank = 0;
  list.forEach(q => {
    const r = gradeCard(q);
    recordWrongState(q, r);
    if(r === 'correct') correct++;
    else if(r === 'wrong') wrong++;
    else blank++;
  });
  renderTabs();
  updateReviewUI();
  showResult(list, correct, wrong, blank);
});

document.getElementById('submitAllBtn').addEventListener('click', () => {
  let correct = 0, wrong = 0, blank = 0;
  questions.forEach(q => {
    let r;
    const card = document.getElementById('card-' + q.num);
    if(card){
      r = gradeCard(q);
    } else {
      r = q.selected === null ? 'blank' : (q.selected === q.correctIndex ? 'correct' : 'wrong');
    }
    recordWrongState(q, r);
    if(r === 'correct') correct++;
    else if(r === 'wrong') wrong++;
    else blank++;
  });
  clearInterval(timerInterval);
  renderTabs();
  updateReviewUI();
  showResult(questions, correct, wrong, blank);
});

document.getElementById('submitReviewBtn').addEventListener('click', () => {
  const list = questions.filter(q => wrongSet.has(q.num));
  let correct = 0, wrong = 0, blank = 0;
  list.forEach(q => {
    const r = gradeCard(q);
    recordWrongState(q, r);
    if(r === 'correct') correct++;
    else if(r === 'wrong') wrong++;
    else blank++;
  });
  updateReviewUI();
  showResult(list, correct, wrong, blank);
});

document.getElementById('resetBtn').addEventListener('click', () => {
  location.reload();
});

updateReviewUI();
renderBatch();
</script>
</body>
</html>
